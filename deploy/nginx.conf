# /etc/nginx/sites-available/dharna-chowk  (then: ln -s ../sites-available/dharna-chowk /etc/nginx/sites-enabled/)
# Replace play.example.com with your domain. Run certbot afterwards for HTTPS.

# Private rooms always land on the same game process; public players are spread out.
map $arg_room $dcc_route { "" $request_id; default $arg_room; }

upstream dcc_game {
    hash $dcc_route consistent;
    server 127.0.0.1:3001;
    # server 127.0.0.1:3002;   # uncomment when you run a second process
}
upstream dcc_web { server 127.0.0.1:3001; }

server {
    listen 80;
    server_name play.example.com;

    location /ws {
        proxy_pass http://dcc_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://dcc_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
